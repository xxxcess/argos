name: Apply skill procedure validation fix

on:
  push:
    branches:
      - fix-skill-procedure-list-validation

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: bootstrap skill procedure validation fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Apply validation and regression test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/tool_implementations.py")
          text = path.read_text(encoding="utf-8")

          helper = '''\ndef _string_list_arg(value: Any, field: str) -> List[str]:
              """Validate a skill list field without splitting scalar strings.

              `list(value)` turns a malformed scalar Markdown payload into one item
              per character. Reject it so the model receives a corrective tool error
              instead of persisting a corrupted SKILL.md file.
              """
              if value is None:
                  return []
              if not isinstance(value, list):
                  raise ValueError(f"{field} must be an array of strings")
              items: List[str] = []
              for index, item in enumerate(value):
                  if not isinstance(item, str):
                      raise ValueError(f"{field}[{index}] must be a string")
                  item = item.strip()
                  if item:
                      items.append(item)
              return items
          '''
          anchor = "\n# ---------------------------------------------------------------------------\n# Search chats\n"
          if "def _string_list_arg(" not in text:
              if anchor not in text:
                  raise SystemExit("skill-list validation insertion anchor not found")
              text = text.replace(anchor, helper + anchor, 1)

          start = text.index('    if action == "add":', text.index('async def do_manage_skills'))
          end = text.index('        if entry.get("_deduped"):', start)
          replacement = '''    if action == "add":
              if not name:
                  return {
                      "error": "name is required for add. Provide the exact slug the user should see, then report the returned name.",
                      "exit_code": 1,
                  }
              proc_arg = args.get("procedure")
              if proc_arg is None:
                  proc_arg = args.get("steps")
              try:
                  proc = _string_list_arg(proc_arg, "procedure")
                  skill_lists = {
                      field: _string_list_arg(args.get(field), field)
                      for field in (
                          "tags",
                          "platforms",
                          "requires_toolsets",
                          "fallback_for_toolsets",
                          "pitfalls",
                          "verification",
                      )
                  }
              except ValueError as exc:
                  return {"error": f"Invalid skill list field: {exc}", "exit_code": 1}
              if not proc and not args.get("body_extra") and not args.get("solution"):
                  return {"error": "procedure (or solution body) is required", "exit_code": 1}
              # Same auto-publish gate as the extractor path — when the user
              # has auto_approve_skills on and the caller didn't pin an explicit
              # status, publish immediately. Audit later demotes/removes on fail.
              _status_arg = args.get("status")
              if not _status_arg:
                  try:
                      from routes.prefs_routes import _load_for_user as _load_prefs
                      _prefs = _load_prefs(owner) or {}
                      _status_arg = "published" if _prefs.get("auto_approve_skills", True) else "draft"
                  except Exception:
                      _status_arg = "draft"
              entry = sm.add_skill(
                  name=args.get("name"),
                  description=(args.get("description") or args.get("title") or "").strip(),
                  category=args.get("category") or "general",
                  tags=skill_lists["tags"],
                  platforms=skill_lists["platforms"],
                  requires_toolsets=skill_lists["requires_toolsets"],
                  fallback_for_toolsets=skill_lists["fallback_for_toolsets"],
                  when_to_use=(args.get("when_to_use") if args.get("when_to_use") is not None
                               else args.get("problem", "")),
                  procedure=proc,
                  pitfalls=skill_lists["pitfalls"],
                  verification=skill_lists["verification"],
                  status=_status_arg,
                  version=args.get("version") or "1.0.0",
                  confidence=args.get("confidence", 0.8),
                  source=args.get("source", "learned"),
                  teacher_model=args.get("teacher_model"),
                  owner=owner,
                  title=args.get("title", ""),
                  problem=args.get("problem", ""),
                  solution=args.get("solution", ""),
                  steps=proc,
              )
          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_tool_implementations_skill_list_args.py")
          test_path.write_text('''import pytest

from src.tool_implementations import _string_list_arg


def test_skill_list_arg_rejects_scalar_markdown():
    payload = "## Procedure\\n1. Open the browser\\n2. Click the result"

    with pytest.raises(ValueError, match="procedure must be an array of strings"):
        _string_list_arg(payload, "procedure")


def test_skill_list_arg_preserves_real_step_arrays():
    assert _string_list_arg([" Open YouTube ", "", "Click the official video"], "procedure") == [
        "Open YouTube",
        "Click the official video",
    ]


def test_skill_list_arg_rejects_non_string_members():
    with pytest.raises(ValueError, match=r"procedure\\[1\\] must be a string"):
        _string_list_arg(["Open YouTube", 2], "procedure")
''', encoding="utf-8")
          PY
          python -m py_compile src/tool_implementations.py tests/test_tool_implementations_skill_list_args.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_bootstrap-skill-procedure-fix.yml
          git add src/tool_implementations.py tests/test_tool_implementations_skill_list_args.py
          git commit -m "fix: validate skill list payloads"
          git push origin HEAD:fix-skill-procedure-list-validation
